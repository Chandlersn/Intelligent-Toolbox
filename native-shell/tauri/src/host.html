<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>收藏箱</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
</style>
</head>
<body>
<!-- 跨源嵌入：显式指向运行中的收集器端点 -->
<script>window.REPO_COLLECTOR = "http://127.0.0.1:8732/collect";</script>
<!-- ball.js 从收集器加载（唯一真源在 web/ball.js，与 Android 壳同一套做法），
     本地那份 src/ball.js 只是离线兜底快照，运行时不再加载，避免两处漂移 -->
<script src="http://127.0.0.1:8732/ball.js"></script>
<!-- 桌面深链（repocollector://collect?...）被唤起时，让球弹个提示 -->
<script>
  if (window.__TAURI__ && window.__TAURI__.event) {
    window.__TAURI__.event.listen('deep-link-received', function (e) {
      var toast = document.createElement('div');
      toast.textContent = '已收到收藏链接，正在加入收藏箱';
      toast.style.cssText = 'position:fixed;left:50%;top:10px;transform:translateX(-50%);' +
        'background:rgba(42,38,32,.94);color:#fff;font-size:13px;padding:8px 14px;' +
        'border-radius:10px;z-index:9999;max-width:90%';
      document.body.appendChild(toast);
      setTimeout(function () { toast.remove(); }, 1800);
    });
  }
</script>
</body>
</html>
