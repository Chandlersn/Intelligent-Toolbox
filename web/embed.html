<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>任意页嵌入示例 · 收藏箱收藏球</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body{max-width:640px;margin:0 auto;padding:48px 22px;line-height:1.8}
  h1{font-size:22px;margin-bottom:8px}
  .code{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:14px;color:var(--ink);white-space:pre-wrap;margin:12px 0}
  .note{color:var(--muted);font-size:14px}
  .tag{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--accent-line);border-radius:999px;padding:2px 12px;margin-bottom:14px}
</style>
</head>
<body>
<span class="tag">一行嵌入 · 跨页面 / 跨平台</span>
<h1>这是你自己的任意页面</h1>
<p class="note">下面这一行 script，就能让「收藏箱收藏球」常驻本页——复制任意 GitHub / GitLab 链接，点一下球或拖上去即收藏。球浮在右下角，随页面走。</p>
<div class="code" id="codeLine">…</div>
<p class="note">把上面那行加到你任何页面的 &lt;/body&gt; 前即可。本页已直接加载，右下角那枚「收」球就是它，体验一下。</p>
<!-- 一键体验：地址按当前来源动态生成（换端口 / 换机器不用改代码），再注入本页 -->
<script>
  (function () {
    var src = location.origin + '/ball.js';
    document.getElementById('codeLine').textContent =
      '<script src="' + src + '"><\/script>';
    var s = document.createElement('script');
    s.src = src;
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
