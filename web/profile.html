<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FBFAF7">
<title>收藏箱 · 画像</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}
  header p{margin:6px 0 0}
  /* 去掉板块标题前的竖线装饰（仅本页，版块少、留白多，竖线显噪） */
  .sec-h::before{display:none}
  .sec-h{margin-bottom:6px}

  /* 概览：一排数字 */
  .ov{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .ov .o{text-align:center;padding:2px 0}
  .ov .o b{display:block;font-family:var(--mono);font-size:23px;font-weight:600;color:var(--accent);line-height:1.15}
  .ov .o span{display:block;font-size:11px;color:var(--muted);margin-top:4px}
  .ovline{margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.65}

  /* 卡内的弱说明 / 分段线 */
  .mini{font-size:11.5px;color:var(--faint);margin:0 0 9px;line-height:1.5}
  .mini.mt{margin-top:7px}
  .hr{height:1px;background:var(--line-soft);margin:14px 0}

  /* 数据条行（可点钻取） */
  .row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
  .row .k{width:96px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s var(--ease)}
  .row .bar{flex:1;height:12px}
  .row .v{width:26px;flex:none;text-align:right;color:var(--muted);font-family:var(--mono);transition:color .15s var(--ease)}
  .row.jp{cursor:pointer}
  .row.jp:hover .k,.row.jp:hover .v{color:var(--accent)}
  .row.jp:hover .bar i{background:var(--accent-2)}

  /* 两个面：比例条 */
  .split{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--line-soft);margin:2px 0 11px}
  .split i{display:block;height:100%}
  .split .p{background:var(--accent)}
  .split .c{background:var(--ok)}
  .sleg{display:flex;gap:18px;font-size:12.5px;color:var(--muted)}
  .sleg b{font-family:var(--mono);color:var(--ink);font-weight:600;margin-left:4px}
  .sleg .d{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:1px}
  .sleg .d.p{background:var(--accent)}
  .sleg .d.c{background:var(--ok)}

  /* 节奏：时间线 + 4 时段 */
  .tl{display:flex;align-items:flex-end;gap:3px;height:56px;padding-top:4px}
  .tl .c{flex:1;border-radius:3px 3px 0 0;min-height:3px;background:var(--accent-line);transition:background .15s var(--ease)}
  .tl .c:hover{background:var(--accent)}
  .tl-x{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:5px}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
  .slot{text-align:center}
  .slot .sb{height:7px;border-radius:999px;background:var(--line-soft);overflow:hidden;margin-bottom:6px}
  .slot .sb i{display:block;height:100%;background:var(--accent);border-radius:999px}
  .slot .sv{font-family:var(--mono);font-size:12.5px;color:var(--ink);line-height:1.2}
  .slot .sk{font-size:11px;color:var(--muted);margin-top:2px}

  /* 可点 chip */
  .chip.jp{cursor:pointer}
  .chip.jp:hover{border-color:var(--accent-line);background:var(--accent-dim)}

  /* 更多维度（折叠） */
  details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:14px}
  details.more>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::before{content:"＋";color:var(--accent);font-weight:600}
  details.more[open]>summary::before{content:"−"}
  details.more[open]>summary{color:var(--ink);margin-bottom:4px}
  .mblk{margin-top:15px}
  .mblk .mh{font-size:12.5px;color:var(--ink);font-weight:600;margin-bottom:7px}
  .mblk .mh em{font-style:normal;color:var(--faint);font-weight:400;margin-left:7px;font-size:11.5px}

  /* 缺角条目 */
  .gap{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;margin:8px 0;font-size:13px}
  .gap .t{color:var(--accent);font-weight:600}
  .gap .h{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}
  .gap.jp{cursor:pointer}
  .gap.jp:hover{border-color:var(--accent-line)}

  .empty{color:var(--muted);text-align:center;padding:16px 0;font-size:13px}
  footer{font-size:11px;color:var(--faint);text-align:center;margin-top:14px}
</style>
</head>
<body data-nav="profile">
<header>
  <h1>画像</h1>
  <p>只照你实际收下了什么，不抽象、不整理——比知识库更靠近真实行动。</p>
</header>

<section class="card">
  <div class="ov" id="ov"></div>
  <div class="ovline" id="ovline"></div>
</section>

<section class="card" id="dirCard" hidden>
  <div class="sec-h">你偏的方向</div>
  <div class="mini">按收藏数量排序，点一下看对应卡片</div>
  <div id="domains"></div>
  <div class="hr"></div>
  <div class="mini">这些方向背后的技术</div>
  <div class="chips" id="techs"></div>
</section>

<section class="card" id="splitCard" hidden>
  <div class="sec-h">生产端 ↔ 认知端</div>
  <div class="mini">你在「做」的（仓库）和你在「学」的（视频等），各占多少</div>
  <div class="split" id="split"></div>
  <div class="sleg" id="sleg"></div>
</section>

<section class="card" id="rhythmCard" hidden>
  <div class="sec-h">收藏节奏</div>
  <div class="mini" id="span-note"></div>
  <div class="tl" id="timeline"></div>
  <div class="tl-x"><span id="tl-a"></span><span id="tl-b"></span></div>
  <div class="slots" id="slots"></div>
</section>

<details class="more" id="moreCard" hidden>
  <summary>更多维度</summary>

  <div class="mblk" id="blk-maturity">
    <div class="mh">仓库量级 <em>项目的江湖地位，不等于你用得多</em></div>
    <div id="maturity"></div>
  </div>

  <div class="mblk" id="blk-sources">
    <div class="mh">怎么进来的 <em>自己找的 / 别人推的</em></div>
    <div class="chips" id="sources"></div>
  </div>

  <div class="mblk" id="blk-motive">
    <div class="mh">收藏动机 <em>带着目的找 / 随手刷到</em></div>
    <div class="chips" id="motive"></div>
  </div>

  <div class="mblk" id="blk-feedback">
    <div class="mh">你的反馈 <em>这一页只有它是记录，不是推断</em></div>
    <div class="chips" id="feedback"></div>
    <div class="mini mt" id="fb-note"></div>
  </div>

  <div class="mblk" id="blk-gaps">
    <div class="mh">行为上的缺角 <em>弱观察，非结论</em></div>
    <div id="gaps"></div>
  </div>
</details>

<footer>智能收藏箱 · 行为层独立画像</footer>

<script>
const $ = (id) => document.getElementById(id);
function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }

async function load(){
  let p;
  try { p = await (await fetch('/api/profile')).json(); }
  catch(e){ $('ov').innerHTML = '<div class="empty">加载失败，请确认服务在运行。</div>'; return; }

  // 一条都没有：整页收敛成一句话，不再铺一排"暂无"空壳
  if(!p.total){
    $('ov').innerHTML = '';
    $('ovline').innerHTML = '<div class="empty" style="text-align:left;padding:6px 2px">还没有收藏。去收几个（GitHub 仓库 / 视频等），这里就开始长东西。</div>';
    ['dirCard','splitCard','rhythmCard','moreCard'].forEach(function(id){ $(id).hidden = true; });
    return;
  }

  // ── 概览：一排数字 + 一句动态小结 ──
  const spanDays = p.span ? p.span.days : 0;
  const ov = [[p.total,'条收藏'], [spanDays||'—','天跨度'], [p.domains.length,'个领域'], [p.techs.length,'项技术']];
  $('ov').innerHTML = ov.map(o => '<div class="o"><b>'+o[0]+'</b><span>'+o[1]+'</span></div>').join('');
  const top = p.domains[0];
  $('ovline').textContent = p.total
    ? ('收了 '+p.total+' 条'+(spanDays?('，横跨 '+spanDays+' 天'):'')+(top?('，最集中在「'+top.name+'」'):'')+'。')
    : '还没有收藏。去收几个，这里就开始长东西。';

  // ── 方向：领域条 + 技术栈 ──
  const doms = p.domains.slice(0, 7);
  const dmax = Math.max(1, ...doms.map(d => d.count));
  $('domains').innerHTML = doms.length ? doms.map(d =>
    '<div class="row jp" data-jump="domain" data-v="'+escAttr(d.name)+'">'+
      '<div class="k" title="'+escAttr(d.name)+'">'+d.name+'</div>'+
      '<div class="bar"><i style="width:'+(d.count/dmax*100)+'%"></i></div>'+
      '<div class="v">'+d.count+'</div></div>').join('')
    : '<div class="empty">还没收藏，先去收几个吧。</div>';

  const tlist = p.techs_top || p.techs;
  $('techs').innerHTML = tlist.length ? tlist.map(t =>
    '<span class="chip jp" data-jump="tech" data-v="'+escAttr(t.name)+'">'+escAttr(t.name)+' <b>'+t.count+'</b></span>').join('')
    + (p.techs.length > tlist.length
        ? '<div class="mini mt">仅显示前 '+tlist.length+' 项 / 共 '+p.techs.length+' 项</div>' : '')
    : '<div class="empty">暂无技术栈数据。</div>';

  // ── 两个面：生产端 ↔ 认知端 ──
  const kd = p.kinds || {};
  const prod = kd.production || 0, cog = kd.cognition || 0, ktot = prod + cog;
  $('split').innerHTML = ktot
    ? '<i class="p" style="width:'+(prod/ktot*100)+'%"></i><i class="c" style="width:'+(cog/ktot*100)+'%"></i>'
    : '';
  $('sleg').innerHTML =
    '<span><span class="d p"></span>生产端<b>'+prod+'</b></span>'+
    '<span><span class="d c"></span>认知端<b>'+cog+'</b></span>';

  // ── 节奏：时间线 ──
  if (p.timeline_days.length){
    const tmax = Math.max(1, ...p.timeline_days.map(t => t.count));
    $('timeline').innerHTML = p.timeline_days.map(t =>
      '<div class="c" title="'+t.date+'：'+t.count+'" style="height:'+(t.count/tmax*100)+'%"></div>').join('');
    $('tl-a').textContent = p.timeline_days[0].date;
    $('tl-b').textContent = p.timeline_days[p.timeline_days.length-1].date;
  } else {
    $('timeline').innerHTML = '<div class="empty">暂无时间线。</div>';
  }
  $('span-note').textContent = p.span
    ? ('从 '+p.span.first+' 到 '+p.span.last+'，共 '+p.span.days+' 天。')
    : '收藏行为本身就是一段轨迹。';

  // ── 节奏：时段 ──
  const slots = p.active_slots || {};
  const smax = Math.max(1, ...Object.values(slots));
  $('slots').innerHTML = Object.entries(slots).map(function(e){
    const k = e[0], v = e[1];
    return '<div class="slot"><div class="sb"><i style="width:'+(v/smax*100)+'%"></i></div>'+
           '<div class="sv">'+v+'</div><div class="sk">'+k.replace(/\s*\d.*$/,'')+'</div></div>';
  }).join('');

  // ── 更多：量级 ──
  function matCls(name){
    if (name.indexOf('顶级') >= 0) return 'core';
    if (name.indexOf('成熟') >= 0) return 'usual';
    return 'try';
  }
  $('maturity').innerHTML = p.maturity.length ? p.maturity.map(m =>
    '<span class="pill '+matCls(m.name)+'">'+m.name+' · '+m.count+'</span>').join('')
    : '<div class="empty">暂无数据。</div>';

  // ── 更多：来源 ──
  const SRC_LABEL = {manual:'自己找的', recommend:'推荐进来', trend:'本周榜收的',
                     share:'分享来的', bookmark:'书签收的', ball:'悬浮球收的', import:'导入的'};
  const sd = p.sources || {}, skeys = Object.keys(sd);
  $('sources').innerHTML = skeys.length ? skeys.map(k =>
    '<span class="chip">'+escAttr(SRC_LABEL[k] || k)+' <b>'+sd[k]+'</b></span>').join('')
    : '<div class="empty">暂无来源数据。</div>';

  // ── 更多：动机 ──
  const md = p.motive_dist || {}, mkeys = Object.keys(md);
  $('motive').innerHTML = mkeys.length ? mkeys.map(k =>
    '<span class="chip jp" data-jump="motive" data-v="'+escAttr(k)+'">'+escAttr(k)+' <b>'+md[k]+'</b></span>').join('')
    : '<div class="empty">暂无动机数据（备注缺失时默认记为「随手刷到」）。</div>';

  // ── 更多：反馈 ──
  const fb = p.feedback || [];
  $('feedback').innerHTML = fb.length ? fb.map(f =>
    '<span class="chip">'+escAttr(f.name)+' <b>'+f.count+'</b></span>').join('')
    : '<div class="empty">还没标过。</div>';
  $('fb-note').textContent = fb.length
    ? ('已标 '+p.feedback_total+' 条 / 共 '+p.total+' 条。剩下的去卡片页随手点一下。')
    : '去卡片页给收过的仓库点「用过 / 弃了 / 还想用」——这一页其余都是推断，只有这块是记录。';

  // ── 更多：缺角 ──
  $('gaps').innerHTML = p.gaps.length ? p.gaps.map(g =>
    '<div class="gap jp" data-jump="domain" data-v="'+escAttr(g.to)+'"><div class="t">'+g.from+' → '+g.to+'</div>'+
    '<div class="h">'+g.hint+'</div></div>').join('')
    : '<div class="empty">暂无明显缺角观察（收藏还不够多，或已较均衡）。</div>';

  // ── 板块按数据出现：没数据就不占空壳 ──
  $('dirCard').hidden = !(p.domains.length || (p.techs && p.techs.length));
  $('splitCard').hidden = !ktot;
  $('rhythmCard').hidden = !(p.timeline_days.length || Object.keys(p.active_slots||{}).length);
  $('blk-maturity').hidden = !p.maturity.length;
  $('blk-sources').hidden = !skeys.length;
  $('blk-motive').hidden = !mkeys.length;
  $('blk-feedback').hidden = !fb.length;
  $('blk-gaps').hidden = !p.gaps.length;
  $('moreCard').hidden = !(p.maturity.length || skeys.length || mkeys.length || fb.length || p.gaps.length);
}

// 钻取：画像上的可点项跳转到卡片页对应筛选
function bindJump(){
  document.querySelectorAll('.jp').forEach(function(el){
    el.addEventListener('click', function(){
      var layer = el.getAttribute('data-jump');
      var v = el.getAttribute('data-v');
      if(layer && v) location.href = 'cards.html?'+layer+'='+encodeURIComponent(v);
    });
  });
}

load().then(bindJump);
</script>
<script src="/nav.js"></script>
</body>
</html>
