<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>收藏箱</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
</style>
</head>
<body>
<!-- 桌面壳专用页：由收集器后端直接服务（8732/ball.html），
     壳窗口 url 指向这里 —— 页面、脚本同源，唯一真源不漂移。
     native-shell/tauri/src/index.html 只是离线兜底快照，运行时不加载。 -->
<script src="/ball.js"></script>
<!-- 桌面深链（repocollector://collect?...）/ 命令行直达被唤起时，让球弹个提示 -->
<script>
  if (window.__TAURI__ && window.__TAURI__.event) {
    window.__TAURI__.event.listen('deep-link-received', function (e) {
      var toast = document.createElement('div');
      toast.textContent = '已收到收藏链接，正在加入收藏箱';
      toast.style.cssText = 'position:fixed;left:50%;top:10px;transform:translateX(-50%);' +
        'background:rgba(42,38,32,.94);color:#fff;font-size:13px;padding:8px 14px;' +
        'border-radius:10px;z-index:9999;max-width:90%';
      document.body.appendChild(toast);
      setTimeout(function () { toast.remove(); }, 1800);
    });
  }
</script>
</body>
</html>
