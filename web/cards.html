<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="收藏箱卡片">
<title>收藏箱 · 卡片</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
  header{padding:28px 4px 8px; display:flex; align-items:baseline; justify-content:space-between}
  header h1{margin:0}
  header p{margin:6px 0 0; width:100%}
  .wrap{margin-top:14px}
  .card .top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .card .name{font-size:16px; font-weight:600; word-break:break-all}
  .card .name a{color:var(--ink); text-decoration:none; border-bottom:1px solid transparent; transition:color .15s var(--ease), border-color .15s var(--ease)}
  .card .name a:hover{color:var(--accent); border-bottom-color:var(--accent)}
  .card .url{font-size:12px; color:var(--faint); margin-top:2px; word-break:break-all}
  .card.focus{box-shadow:0 0 0 2px var(--accent); border-radius:var(--r-lg); scroll-margin-top:84px}
  /* 领域徽标沿用 theme.css 的 .pill（淡底描边），不在这里另立一套实底样式 */
  .card .top .pill{white-space:nowrap}
  .row{margin-top:12px}
  .row .k{font-size:12px; color:var(--muted); margin-bottom:4px}
  .row .v{font-size:14px; color:var(--ink)}
  .rel{font-size:13px; border-top:1px dashed var(--line); margin-top:12px; padding-top:10px}
  .rel .ri{display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px solid var(--line-soft)}
  .rel .ri:last-child{border-bottom:none}
  .rel .rn{color:var(--ink); word-break:break-all}
  .rel .rr{color:var(--muted); font-size:12px; white-space:nowrap}
  .stars{color:var(--faint)}
  .acts{display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap}
  .share-title{font-size:15px; font-weight:600; color:var(--ink); margin-bottom:10px}
  .share-acts{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .share-note{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.5}

  /* ===== 新筛选区：搜索+排序一行，三组胶囊云 ===== */
  .fbar{margin-top:14px}
  .fbar .ftop{display:flex; gap:8px; align-items:center}
  .fbar .ftop input[type=text]{flex:1; min-width:0; font-size:13px; color:var(--ink); background:var(--surface-2);
    border:1px solid var(--line); border-radius:var(--r); padding:7px 10px; font-family:inherit; outline:none}
  .fbar .ftop input[type=text]:focus{border-color:var(--accent)}
  .fbar .ftop select{font-size:13px; color:var(--muted); background:var(--surface-2);
    border:1px solid var(--line); border-radius:var(--r); padding:7px 8px; font-family:inherit; outline:none}
  .grp{margin-top:13px}
  .grp .gt{font-size:12px; color:var(--muted); margin-bottom:7px; display:flex; align-items:center; gap:6px}
  .grp .gt .cnt{color:var(--faint); font-size:11px}
  .grp .pills{display:flex; flex-wrap:wrap; gap:7px}
  .pillx{font-size:12.5px; color:var(--ink); background:var(--surface-2); border:1px solid var(--line);
    border-radius:999px; padding:4px 11px; cursor:pointer; user-select:none; transition:all .12s var(--ease);
    display:inline-flex; align-items:center; gap:5px}
  .pillx:hover{border-color:var(--accent)}
  .pillx.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .pillx .n{font-size:11px; opacity:.7}
  .pillx.on .n{opacity:.85}
  .fbar .clear{margin-top:13px; font-size:12px; color:var(--muted); background:none; border:none;
    cursor:pointer; padding:0; font-family:inherit; text-decoration:underline; opacity:.8}
  .fbar .clear:hover{color:var(--accent); opacity:1}
  .fbar .clear[hidden]{display:none}
  .res-cnt{margin-top:15px; font-size:12px; color:var(--faint)}
  /* 使用反馈选中态：沿用主题强调色，不另立配色 */
  .abtn.fb-on{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}
  .res-hint{margin-top:10px; font-size:13px; color:var(--muted); line-height:1.6}
  .res-hint a{color:var(--accent); cursor:pointer; text-decoration:underline}
  /* 类型徽标：生产端（仓库）中性、认知端（抖音等）语义绿，沿用主题变量 */
  .pill.k-prod{ color:var(--muted); background:var(--surface-2); border-color:var(--line); }
  .pill.k-cog{ color:var(--ok); background:rgba(63,107,94,.10); border-color:rgba(63,107,94,.34); }
  /* 原文逐字稿：认知端双保留的另一半，可滚动长文 */
  .rawbox{ font-size:13px; color:var(--muted); line-height:1.7; max-height:220px; overflow:auto;
    white-space:pre-wrap; background:var(--surface-2); border:1px solid var(--line);
    border-radius:var(--r); padding:10px; margin-top:4px; }
</style>
</head>
<body data-nav="cards">
<header>
  <div>
    <h1>卡片</h1>
    <p>每个收藏自动生成多维画像；跨仓库的关联即你认知网络的连线。</p>
  </div>
</header>
<div class="fbar">
  <div class="ftop">
    <input type="text" id="f-q" placeholder="搜索仓库名 / 标签 / 备注 / 用途…">
    <select id="f-sort">
      <option value="time">最近收藏</option>
      <option value="stars">星标最多</option>
      <option value="rec">推荐最高</option>
    </select>
  </div>
  <div class="grp" id="grp-kind">
    <div class="gt">类型</div>
    <div class="pills" id="pills-kind">
      <span class="pillx" data-v="production">生产端</span>
      <span class="pillx" data-v="cognition">认知端</span>
    </div>
  </div>
  <div class="grp" id="grp-domain">
    <div class="gt">领域 <span class="cnt" id="cnt-domain"></span></div>
    <div class="pills" id="pills-domain"></div>
  </div>
  <div class="grp" id="grp-tech">
    <div class="gt">技术栈 <span class="cnt" id="cnt-tech"></span></div>
    <div class="pills" id="pills-tech"></div>
  </div>
  <div class="grp" id="grp-motive">
    <div class="gt">收藏动机 <span class="cnt" id="cnt-motive"></span></div>
    <div class="pills" id="pills-motive"></div>
  </div>
  <div class="grp" id="grp-use">
    <div class="gt">用过吗 <span class="cnt" id="cnt-use"></span></div>
    <div class="pills" id="pills-use"></div>
  </div>
  <button class="clear" id="f-clr" hidden>清空全部筛选</button>
  <div class="res-cnt" id="f-cnt"></div>
</div>
<div class="wrap" id="wrap"><div class="empty">加载中…</div></div>

<div class="share-mask" id="shareMask" hidden>
  <div class="share-box">
    <div class="share-title">分享这张卡片</div>
    <textarea id="shareText" readonly></textarea>
    <div class="share-acts">
      <button class="abtn share" id="copyShare">复制文本</button>
      <button class="abtn" id="copyLink">复制深链</button>
      <button class="abtn del" id="closeShare">关闭</button>
    </div>
    <div class="share-note">复制后可直接发给微信 / 钉钉 / 邮件；深链在装有收藏箱的设备上点开即收。</div>
  </div>
</div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function cardHTML(it){
  var c = it.card || {};
  var meta = it.meta || {};
  var name = meta.name || it.url;
  var domain = c.domain || '未分类';
  var rec = (c.recommendation!=null) ? ('推荐 '+c.recommendation+'/5') : '';
  var isCog = (it.kind === 'cognition');
  var kindPill = isCog
    ? '<span class="pill k-cog" title="认知端：抖音等内容收藏">认知</span>'
    : '<span class="pill k-prod" title="生产端：GitHub/GitLab 仓库">生产</span>';
  var src = c.source==='llm'
    ? '<span class="src llm" title="由大模型分析生成">AI 分析</span>'
    : '<span class="src heu" title="规则自动生成的预览，未接入深度分析">规则预览</span>';
  var tech = (c.tech_stack||[]).map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('');
  var tags = (c.tags||[]).map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('');
  var rel = (c.related_nodes||[]).map(function(r){
    return '<div class="ri"><span class="rn">'+esc(r.name||r.url)+'</span><span class="rr">'+esc(r.reason)+'</span></div>';
  }).join('');
  var starsTxt = (meta.stars!=null) ? ('<span class="stars">★ '+meta.stars+'</span>') : '';
  // 原文逐字稿：认知端的另一半（与萃取卡片双保留），仅认知端有
  var rawTxt = (isCog && it.raw && String(it.raw).trim())
    ? '<div class="row"><div class="k">原文逐字稿（与上方萃取双保留）</div><div class="rawbox">'+esc(it.raw)+'</div></div>'
    : '';
  var viewLabel = isCog ? '看原视频 ↗' : '查看仓库 ↗';
  return ''+
  '<div class="card" id="card-'+esc(it.id)+'" data-id="'+esc(it.id)+'" data-url="'+esc(it.url)+'">'+
    '<div class="top">'+
      '<div><div class="name"><a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(name)+'</a></div><div class="url">'+esc(it.url)+'</div></div>'+
      '<span class="pill">'+esc(domain)+'</span>'+kindPill+
      (it.__upd ? '<span class="pill upd">有更新</span>' : '')+src+
    '</div>'+
    (starsTxt?'<div class="row"><span class="v">'+starsTxt+'　'+(c.maturity?esc(c.maturity):'')+'　'+rec+'</span></div>':'')+
    (meta.description?'<div class="row"><div class="k">用途</div><div class="v">'+esc(meta.description)+'</div></div>':'')+
    (tech?'<div class="row"><div class="k">技术栈</div><div class="chips">'+tech+'</div></div>':'')+
    (c.why_needed?'<div class="row"><div class="k">你为什么可能需要它</div><div class="v">'+esc(c.why_needed)+'</div></div>':'')+
    (tags?'<div class="row"><div class="k">多维标签</div><div class="chips">'+tags+'</div></div>':'')+
    rawTxt+
    (rel?'<div class="rel"><div class="k">关联节点</div>'+rel+'</div>':'')+
    '<div class="row"><div class="k">后来怎么样了（只有你知道，不靠推测）</div>'+
      '<div class="acts">'+
      '<button class="abtn muted'+(it.feedback==='used'?' fb-on':'')+'" data-act="fb" data-fb="used" data-id="'+it.id+'">用过</button>'+
      '<button class="abtn muted'+(it.feedback==='dropped'?' fb-on':'')+'" data-act="fb" data-fb="dropped" data-id="'+it.id+'">弃了</button>'+
      '<button class="abtn muted'+(it.feedback==='want'?' fb-on':'')+'" data-act="fb" data-fb="want" data-id="'+it.id+'">还想用</button>'+
      '</div></div>'+
    '<div class="row"><div class="acts">'+
      '<button class="abtn muted" data-act="view" data-url="'+esc(it.url)+'">'+viewLabel+'</button>'+
      '<button class="abtn" data-act="regen" data-id="'+it.id+'">重算</button>'+
      '<button class="abtn share" data-act="share" data-id="'+it.id+'">分享</button>'+
      '<button class="abtn del" data-act="del" data-id="'+it.id+'">删除</button>'+
    '</div></div>'+
  '</div>';
}

// ===== 新筛选：胶囊云（同层 OR，跨层 AND）=====
var LAYERS = ['domain', 'tech', 'motive', 'use'];
var SEL = { domain: [], tech: [], motive: [], use: [], kind: [] }; // 每层选中的取值列表

// 从 URL 预读筛选条件（如 profile/map 页钻取过来：cards.html?domain=AI·LLM）
(function readUrlSel(){
  var qs = new URLSearchParams(location.search);
  LAYERS.forEach(function(layer){
    var v = qs.get(layer);
    if(v) SEL[layer] = v.split(',').filter(Boolean);
  });
  var q = qs.get('q');
  if(q) setTimeout(function(){ var el=document.getElementById('f-q'); if(el) el.value=q; }, 0);
})();

function loadFacets(){
  fetch('/api/facets').then(function(r){return r.json()}).then(function(f){
    LAYERS.forEach(function(layer){ renderPills(layer, f[layer]||[]); });
    // URL 预选：胶囊渲染后高亮对应项
    LAYERS.forEach(function(layer){
      SEL[layer].forEach(function(v){
        var p=document.querySelector('#pills-'+layer+' .pillx[data-v="'+cssEsc(v)+'"]');
        if(p) p.classList.add('on');
      });
    });
    updateClearBtn();
  }).catch(function(){});
}

function cssEsc(s){ return String(s).replace(/["\\]/g,'\\$&'); }

function renderPills(layer, values){
  var box=document.getElementById('pills-'+layer);
  var cntEl=document.getElementById('cnt-'+layer);
  var grp=document.getElementById('grp-'+layer);
  if(!values.length){ grp.style.display='none'; return; }
  grp.style.display='';
  cntEl.textContent='('+values.length+')';
  box.innerHTML=values.map(function(x){
    var on=SEL[layer].indexOf(x.value)>=0;
    return '<span class="pillx'+(on?' on':'')+'" data-v="'+esc(x.value)+'">'+esc(x.value)+
      ' <span class="n">'+x.count+'</span></span>';
  }).join('');
  box.querySelectorAll('.pillx').forEach(function(p){
    p.addEventListener('click',function(){
      var v=p.getAttribute('data-v');
      var i=SEL[layer].indexOf(v);
      if(i>=0){ SEL[layer].splice(i,1); p.classList.remove('on'); }
      else { SEL[layer].push(v); p.classList.add('on'); }
      updateClearBtn(); load();
    });
  });
}

function updateClearBtn(){
  var has=LAYERS.concat(['kind']).some(function(l){return SEL[l].length;})
        || document.getElementById('f-q').value.trim();
  document.getElementById('f-clr').hidden=!has;
}

// 类型筛选（生产端 / 认知端）：胶囊直接写死在 HTML 里，这里只绑定点击
(function wireKindPills(){
  var box=document.getElementById('pills-kind');
  if(!box) return;
  box.querySelectorAll('.pillx').forEach(function(p){
    p.addEventListener('click',function(){
      var v=p.getAttribute('data-v');
      var i=SEL.kind.indexOf(v);
      if(i>=0){ SEL.kind.splice(i,1); p.classList.remove('on'); }
      else { SEL.kind.push(v); p.classList.add('on'); }
      updateClearBtn(); load();
    });
  });
})();

function load(){
  var w=document.getElementById('wrap');
  var q=document.getElementById('f-q').value.trim();
  var sort=document.getElementById('f-sort').value;
  var params=[];
  LAYERS.concat(['kind']).forEach(function(layer){
    SEL[layer].forEach(function(v){ params.push(layer+'='+encodeURIComponent(v)); });
  });
  if(q) params.push('q='+encodeURIComponent(q));
  if(sort) params.push('sort='+encodeURIComponent(sort));
  var url='/api/cards'+(params.length?('?'+params.join('&')):'');
  fetch(url).then(function(r){return r.json()}).then(function(d){
    var items=d.items||[];
    document.getElementById('f-cnt').textContent='共 '+items.length+' 个仓库'+(items.length?('（已按“'+sortName(sort)+'”排序）'):'');
    if(!items.length){ renderEmpty(); return; }
    render(items);
  }).catch(function(){ w.innerHTML='<div class="empty">加载失败，确认服务在运行。</div>'; });
}

function sortName(s){ return s==='stars'?'星标最多':(s==='rec'?'推荐最高':'最近收藏'); }

function renderEmpty(){
  var w=document.getElementById('wrap');
  var anySel=LAYERS.some(function(l){return SEL[l].length;});
  var html='<div class="empty">没有符合当前条件的收藏。';
  if(anySel){
    html+='<div class="res-hint">筛选是「同层任一命中、跨层必须都满足」——试着<b>少选几个条件</b>，'+
      '或点<a id="quick-clr">清空筛选</a>重来。</div>';
  }
  html+='</div>';
  w.innerHTML=html;
  var qc=document.getElementById('quick-clr');
  if(qc) qc.addEventListener('click', clearAll);
}

// 记录正在重算的卡片 id，避免与 8 秒轮询 load() 互相打架（轮询时跳过重建这些卡片）
var REGEN = {};
function cssId(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g,''); }

// 轻量吐司提示（复用主题 .toast）
var _toastT;
function toast(msg){
  var el=document.getElementById('toast');
  if(!el) return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_toastT);
  _toastT=setTimeout(function(){ el.classList.remove('show'); }, 2600);
}

function render(items){
  var w=document.getElementById('wrap');
  // 标注哪些卡片有未读更新（来自全局 window.__repoUpdates）
  items.forEach(function(it){ it.__upd = !!window.__repoUpdates[String(it.id)]; });
  w.innerHTML=items.map(cardHTML).join('');
  applyUpdateBadges();
  // 重建后恢复仍在重算中的卡片按钮状态（防止并发重算被整页刷新冲掉）
  Object.keys(REGEN).forEach(function(rid){
    var btn=w.querySelector('#card-'+cssId(rid)+' .abtn[data-act="regen"]');
    if(btn){ btn.disabled=true; btn.textContent='重算中…'; }
  });
  w.querySelectorAll('.abtn').forEach(function(b){
    b.addEventListener('click',function(){
      var act=b.getAttribute('data-act');
      var id=b.getAttribute('data-id');
      if(act==='view'){ window.open(b.getAttribute('data-url'), '_blank', 'noopener'); return; }
      if(act==='del'){ onDelete(b, id); return; }
      if(act==='share'){ onShare(id); return; }
      if(act==='fb'){ onFeedback(b, id, b.getAttribute('data-fb')); return; }
      // regen：标记该卡正在重算，期间轮询不整页重建；带超时，失败/超时保留原卡片并提示
      if(REGEN[id]) return; // 已在重算中，防止连点
      REGEN[id]=true;
      b.disabled=true; b.textContent='重算中…';
      var ac=new AbortController();
      var timer=setTimeout(function(){ ac.abort(); }, 12000);
      fetch('/api/card/regenerate',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id:id}), signal:ac.signal})
        .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
        .then(function(d){
          clearTimeout(timer); delete REGEN[id];
          if(d&&d.ok&&d.unchanged){ b.disabled=false; b.textContent='重算';
            toast('大模型暂不可用，已保留原分析卡片'); return; }
          if(d&&d.ok){ toast('已重算并更新'); load(); }
          else { b.disabled=false; b.textContent='重算'; toast('重算未返回结果，原卡片保留'); }
        })
        .catch(function(e){
          clearTimeout(timer); delete REGEN[id];
          b.disabled=false; b.textContent='重算';
          toast(e&&e.name==='AbortError' ? '重算超时（12s），原卡片保留' : '重算失败，原卡片未改动');
        });
    });
  });
  // 从其他页面带 ?id= 跳转过来时，定位并高亮对应卡片
  var fid=getParam('id');
  if(fid){ focusCard(fid); }
}

// 仓库更新角标：根据 window.__repoUpdates（repo_id -> [events]）给卡片贴/摘「有更新」
function applyUpdateBadges(){
  document.querySelectorAll('#wrap .card[data-id]').forEach(function(cardEl){
    var id=cardEl.getAttribute('data-id');
    var has=!!window.__repoUpdates[id];
    var existing=cardEl.querySelector('.pill.upd');
    if(has && !existing){
      var top=cardEl.querySelector('.top');
      if(top){ var b=document.createElement('span'); b.className='pill upd'; b.textContent='有更新'; top.appendChild(b); }
    } else if(!has && existing){ existing.remove(); }
  });
}
// nav.js 在加载/检查更新后派发此事件，实时刷新角标
window.addEventListener('repo:updates', function(e){
  window.__repoUpdates = (e.detail && e.detail.byRepo) || {};
  applyUpdateBadges();
});

function getParam(k){
  var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);
  return m?decodeURIComponent(m[1]):'';
}

function focusCard(id){
  var el=document.getElementById('card-'+id);
  if(!el) return;
  // 若当前筛选把该卡片过滤掉了，先清空筛选再定位
  if(el.offsetParent===null){
    clearAll();
    setTimeout(function(){ focusCard(id); }, 350);
    return;
  }
  document.querySelectorAll('.card.focus').forEach(function(c){ c.classList.remove('focus'); });
  el.classList.add('focus');
  el.scrollIntoView({behavior:'smooth', block:'start'});
}

// 使用反馈：用过 / 弃了 / 还想用（再点一次同一个值 = 取消）
function onFeedback(btn, id, fb){
  fetch('/api/item/feedback',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:id, feedback:fb})})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d && d.ok){ toast(d.feedback ? '已记下：' + fbName(fb) : '已取消标记'); load(); }
      else { toast('没记上：' + ((d && d.error) || '')); }
    })
    .catch(function(){ toast('没记上，确认服务在运行'); });
}
function fbName(k){ return k==='used' ? '用过' : (k==='dropped' ? '弃了' : '还想用'); }

function onDelete(btn, id){
  if(!confirm('确定删除这条收藏？关联的图谱、画像数据会同步清除，且不可恢复。')) return;
  btn.disabled=true; btn.textContent='删除中…';
  fetch('/api/item/'+id,{method:'DELETE'}).then(function(r){return r.json()}).then(function(d){
    if(d.ok){ load(); } else { alert('删除失败：'+(d.error||'')); btn.disabled=false; btn.textContent='删除'; }
  }).catch(function(){ alert('删除失败，确认服务在运行'); btn.disabled=false; btn.textContent='删除'; });
}

function onShare(id){
  // 取最新卡片数据拼可分享文本
  fetch('/api/items').then(function(r){return r.json()}).then(function(d){
    var it=(d.items||[]).filter(function(x){return String(x.id)===String(id)})[0];
    if(!it){ alert('未找到该收藏'); return; }
    var c=it.card||{}, meta=it.meta||{};
    var name=meta.name||it.url;
    var isCog=(it.kind==='cognition');
    var lines=[];
    lines.push('【收藏箱 · '+(isCog?'内容卡片':'仓库卡片')+'】');
    lines.push(name+'  '+ it.url);
    if(c.domain) lines.push('领域：'+c.domain);
    if(c.purpose) lines.push('用途：'+c.purpose);
    if(c.tech_stack&&c.tech_stack.length) lines.push('技术栈：'+c.tech_stack.join('、'));
    if(c.why_needed) lines.push('我为什么收：'+c.why_needed);
    if(c.maturity) lines.push('成熟度：'+c.maturity);
    if(isCog && it.raw && String(it.raw).trim()) lines.push('原文逐字稿：'+it.raw);
    if(c.source==='llm') lines.push('（由 AI 分析生成）');
    var txt=lines.join('\n');
    var link=location.origin+'/collect?url='+encodeURIComponent(it.url);
    var mask=document.getElementById('shareMask');
    var ta=document.getElementById('shareText');
    ta.value=txt;
    mask.hidden=false;
    var copyBtn=document.getElementById('copyShare');
    var linkBtn=document.getElementById('copyLink');
    copyBtn.onclick=function(){ ta.value=txt; ta.select(); doCopy(txt,'文本已复制'); };
    linkBtn.onclick=function(){ ta.value=link; ta.select(); doCopy(link,'深链已复制'); };
    document.getElementById('closeShare').onclick=function(){ mask.hidden=true; };
    mask.onclick=function(e){ if(e.target===mask) mask.hidden=true; };
  }).catch(function(){ alert('加载失败'); });
}

function doCopy(text, okMsg){
  var done=function(){ alert(okMsg); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text,okMsg); });
  } else { fallbackCopy(text,okMsg); }
}
function fallbackCopy(text, okMsg){
  var ta=document.getElementById('shareText'); ta.value=text; ta.select();
  try{ document.execCommand('copy'); alert(okMsg); }catch(e){ alert('复制失败，请手动选择文本复制'); }
}

function clearAll(){
  LAYERS.concat(['kind']).forEach(function(layer){ SEL[layer] = []; });
  document.getElementById('f-q').value='';
  // 重置所有胶囊高亮
  LAYERS.concat(['kind']).forEach(function(layer){
    document.querySelectorAll('#pills-'+layer+' .pillx').forEach(function(p){ p.classList.remove('on'); });
  });
  updateClearBtn(); load();
}
document.getElementById('f-clr').addEventListener('click', clearAll);

var _t;
document.getElementById('f-q').addEventListener('input',function(){
  clearTimeout(_t); _t=setTimeout(function(){ updateClearBtn(); load(); }, 300);
});
document.getElementById('f-sort').addEventListener('change', load);

// 若有卡片正在重算，跳过本次轮询，避免整页重建把"重算中"按钮冲掉导致无法再次点击
setInterval(function(){
  if(document.visibilityState!=='visible') return;
  if(Object.keys(REGEN).length) return;
  load();
}, 8000);
