<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="收藏箱卡片">
<title>收藏箱 · 卡片</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
  header{padding:28px 4px 8px; display:flex; align-items:baseline; justify-content:space-between}
  header h1{margin:0}
  header p{margin:6px 0 0; width:100%}
  .wrap{margin-top:14px}
  .card .top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .card .name{font-size:16px; font-weight:600; word-break:break-all}
  .card .name a{color:var(--ink); text-decoration:none; border-bottom:1px solid transparent; transition:color .15s var(--ease), border-color .15s var(--ease)}
  .card .name a:hover{color:var(--accent); border-bottom-color:var(--accent)}
  .card .url{font-size:12px; color:var(--faint); margin-top:2px; word-break:break-all}
  .card.focus{box-shadow:0 0 0 2px var(--accent); border-radius:var(--r-lg); scroll-margin-top:84px}
  /* 领域徽标沿用 theme.css 的 .pill（淡底描边），不在这里另立一套实底样式 */
  .card .top .pill{white-space:nowrap}
  .row{margin-top:12px}
  .row .k{font-size:12px; color:var(--muted); margin-bottom:4px}
  .row .v{font-size:14px; color:var(--ink)}
  .rel{font-size:13px; border-top:1px dashed var(--line); margin-top:12px; padding-top:10px}
  .rel .ri{display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px solid var(--line-soft)}
  .rel .ri:last-child{border-bottom:none}
  .rel .rn{color:var(--ink); word-break:break-all}
  .rel .rr{color:var(--muted); font-size:12px; white-space:nowrap}
  .stars{color:var(--faint)}
  .acts{display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap}
  .share-title{font-size:15px; font-weight:600; color:var(--ink); margin-bottom:10px}
  .share-acts{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .share-note{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.5}

  /* ===== 卡片操作区：主行动（用过/弃了/还想用）+ 一个「更多」菜单收次要动作 ===== */
  .card{position:relative}
  .card.lift{z-index:41}
  .card .acts{justify-content:flex-start}
  .card .name .ext{color:var(--faint); font-size:12px; margin-left:2px}
  .more{position:relative; margin-left:auto}
  .more>summary{list-style:none; display:inline-flex; align-items:center; gap:6px;
    font-size:14px; font-weight:600; line-height:1; color:var(--muted);
    border:1px solid var(--line); border-radius:var(--r); padding:9px 14px;
    cursor:pointer; user-select:none}
  .more>summary::-webkit-details-marker{display:none}
  .more>summary::marker{content:""}
  .more>summary:hover{color:var(--ink); border-color:var(--faint); background:var(--surface-2)}
  .more[open]>summary{color:var(--accent); border-color:var(--accent); background:var(--accent-dim)}
  .more .menu{position:absolute; right:0; bottom:calc(100% + 6px); min-width:132px; z-index:40;
    display:flex; flex-direction:column; gap:1px; padding:5px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:0 10px 28px rgba(35,32,27,.16)}
  .more .menu .abtn{width:100%; justify-content:flex-start; font-weight:500;
    border:none; background:transparent; padding:8px 10px}
  .more .menu .abtn:hover{background:var(--surface-2)}
  .more .menu .abtn.del{color:var(--err)}
  .more .menu .abtn.del:hover{background:rgba(180,71,47,.08)}

  /* ===== 新筛选区：搜索+排序一行，三组胶囊云 ===== */
  .fbar{margin-top:14px}
  .fbar .ftop{display:flex; gap:8px; align-items:center}
  .fbar .ftop input[type=text]{flex:1; min-width:0; font-size:13px; color:var(--ink); background:var(--surface-2);
    border:1px solid var(--line); border-radius:var(--r); padding:7px 10px; font-family:inherit; outline:none}
  .fbar .ftop input[type=text]:focus{border-color:var(--accent)}
  .fbar .ftop select{font-size:13px; color:var(--muted); background:var(--surface-2);
    border:1px solid var(--line); border-radius:var(--r); padding:7px 8px; font-family:inherit; outline:none}
  .grp{margin-top:13px}
  .grp .gt{font-size:12px; color:var(--muted); margin-bottom:7px; display:flex; align-items:center; gap:6px}
  .grp .gt .cnt{color:var(--faint); font-size:11px}
  .grp .pills{display:flex; flex-wrap:wrap; gap:7px}
  .pillx{font-size:12.5px; color:var(--ink); background:var(--surface-2); border:1px solid var(--line);
    border-radius:999px; padding:4px 11px; cursor:pointer; user-select:none; transition:all .12s var(--ease);
    display:inline-flex; align-items:center; gap:5px}
  .pillx:hover{border-color:var(--accent)}
  .pillx.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .pillx .n{font-size:11px; opacity:.7}
  .pillx.on .n{opacity:.85}
  .fbar .clear{margin-top:13px; font-size:12px; color:var(--muted); background:none; border:none;
    cursor:pointer; padding:0; font-family:inherit; text-decoration:underline; opacity:.8}
  .fbar .clear:hover{color:var(--accent); opacity:1}
  .fbar .clear[hidden]{display:none}
  .res-cnt{margin-top:15px; font-size:12px; color:var(--faint)}
  /* 使用反馈选中态：沿用主题强调色，不另立配色 */
  .abtn.fb-on{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}
  .res-hint{margin-top:10px; font-size:13px; color:var(--muted); line-height:1.6}
  .res-hint a{color:var(--accent); cursor:pointer; text-decoration:underline}
  /* 类型徽标：生产端（仓库）中性、认知端（抖音等）语义绿，沿用主题变量 */
  .pill.k-prod{ color:var(--muted); background:var(--surface-2); border-color:var(--line); }
  .pill.k-cog{ color:var(--ok); background:rgba(63,107,94,.10); border-color:rgba(63,107,94,.34); }
  /* 原文逐字稿：认知端双保留的另一半，可滚动长文（折叠在 details 内） */
  .rawbox{ font-size:13px; color:var(--muted); line-height:1.7; max-height:220px; overflow:auto;
    white-space:pre-wrap; background:var(--surface-2); border:1px solid var(--line);
    border-radius:var(--r); padding:10px; margin-top:4px; }
  /* 逐字稿 · 结构化 markdown 笔记（AI 整理）：要点层常显 + 纪要层折叠，减轻长文视角疲劳 */
  .note-meta{ margin-left:8px; color:var(--faint); font-weight:400 }
  .mdbox{ font-size:13.5px; color:var(--ink); line-height:1.85; background:var(--surface-2);
    border:1px solid var(--line); border-radius:var(--r); padding:13px 15px; margin-top:4px; }
  .mdbox h2{ font-size:15px; margin:0 0 10px; color:var(--ink); }
  .mdbox h3{ font-size:14px; margin:18px 0 7px; padding-bottom:5px; color:var(--ink);
    font-weight:600; border-bottom:1px solid var(--line); }
  .mdbox h3:first-child{ margin-top:0 }
  .mdbox h4{ font-size:13.5px; margin:14px 0 5px; color:var(--ink); font-weight:600;
    padding-left:9px; border-left:2px solid var(--accent); }
  .mdbox p{ margin:8px 0; }
  .mdbox ul,.mdbox ol{ margin:8px 0; padding-left:22px; }
  .mdbox li{ margin:5px 0; }
  .mdbox li::marker{ color:var(--faint) }
  .mdbox blockquote{ margin:10px 0; padding:7px 11px; color:var(--muted);
    background:var(--surface); border-left:2px solid var(--line); border-radius:var(--r-sm); }
  .mdbox code{ font-family:var(--mono); font-size:12px; background:var(--surface);
    border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  .mdbox hr{ border:0; border-top:1px solid var(--line); margin:14px 0; }
  .mdbox strong{ font-weight:600; }
  /* 纪要层折叠开关：虚线胶囊状的「展开」入口，收起时卡片高度可控 */
  .mdmore{ margin-top:8px }
  .mdmore>summary{ list-style:none; cursor:pointer; user-select:none;
    font-size:12.5px; color:var(--muted); padding:9px 13px; line-height:1.4;
    background:var(--surface-2); border:1px dashed var(--line); border-radius:var(--r);
    transition:color .15s var(--ease), border-color .15s var(--ease), background .15s var(--ease) }
  .mdmore>summary::-webkit-details-marker{ display:none }
  .mdmore>summary::marker{ content:"" }
  .mdmore>summary::before{ content:"▸"; color:var(--faint); margin-right:7px }
  .mdmore[open]>summary::before{ content:"▾" }
  .mdmore>summary:hover{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-dim) }
  .mdmore[open]>summary{ border-style:solid; border-color:var(--line); border-bottom:none;
    border-bottom-left-radius:0; border-bottom-right-radius:0 }
  .mdbox.mdbody{ margin-top:0; border-top-left-radius:0; border-top-right-radius:0; border-top:none }
  /* 原始逐字稿折叠开关 */
  .rawdet{ margin-top:8px; }
  .rawdet summary{ cursor:pointer; font-size:12px; color:var(--muted); padding:3px 0; }
  .rawdet summary:hover{ color:var(--accent); }
  /* 悬浮目录：长纪要导航（跳转后标题不被顶栏遮住） */
  .mdbox h2,.mdbox h3,.mdbox h4{ scroll-margin-top:14px }
  /* 底部有固定导航条（nav.js 注入，高约 48px，z-index 9999）——悬浮按钮必须抬到它上方 */
  .toc-fab{ display:none; position:fixed; right:14px; bottom:calc(60px + env(safe-area-inset-bottom)); z-index:60;
    font:600 13px/1 var(--sans); color:var(--muted); background:var(--surface);
    border:1px solid var(--line); border-radius:999px; padding:10px 15px;
    cursor:pointer; user-select:none; box-shadow:0 6px 18px rgba(35,32,27,.14);
    transition:color .15s var(--ease), border-color .15s var(--ease), transform .12s var(--ease) }
  .toc-fab.on{ display:inline-block }
  .toc-fab:hover{ color:var(--accent); border-color:var(--accent-line); transform:translateY(-1px) }
  .toc-panel{ display:none; position:fixed; right:14px; bottom:calc(112px + env(safe-area-inset-bottom)); z-index:60;
    width:min(304px, 78vw); max-height:min(58vh, 440px); overflow:auto;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:0 16px 44px rgba(35,32,27,.20); padding:8px }
  .toc-panel.on{ display:block }
  .toc-h{ font-size:12px; color:var(--faint); padding:6px 8px 8px;
    border-bottom:1px solid var(--line-soft); margin-bottom:4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .toc-list a{ display:block; font-size:12.5px; line-height:1.5; color:var(--ink);
    text-decoration:none; padding:6px 8px; border-radius:var(--r-sm); cursor:pointer;
    border-left:2px solid transparent }
  .toc-list a.lv1{ font-weight:600 }
  .toc-list a.lv2{ padding-left:18px; color:var(--muted); font-size:12px }
  .toc-list a:hover{ background:var(--surface-2); color:var(--accent) }
  .toc-list a.cur{ color:var(--accent); background:var(--accent-dim);
    border-left-color:var(--accent) }
</style>
</head>
<body data-nav="cards">
<header>
  <div>
    <h1>卡片</h1>
    <p>每个收藏自动生成多维画像；跨仓库的关联即你认知网络的连线。</p>
  </div>
</header>
<div class="fbar">
  <div class="ftop">
    <input type="text" id="f-q" placeholder="搜索仓库名 / 标签 / 备注 / 用途…">
    <select id="f-sort">
      <option value="time">最近收藏</option>
      <option value="stars">星标最多</option>
      <option value="rec">推荐最高</option>
    </select>
  </div>
  <div class="grp" id="grp-kind">
    <div class="gt">类型</div>
    <div class="pills" id="pills-kind">
      <span class="pillx" data-v="production">生产端</span>
      <span class="pillx" data-v="cognition">认知端</span>
    </div>
  </div>
  <div class="grp" id="grp-domain">
    <div class="gt">领域 <span class="cnt" id="cnt-domain"></span></div>
    <div class="pills" id="pills-domain"></div>
  </div>
  <div class="grp" id="grp-tech">
    <div class="gt">技术栈 <span class="cnt" id="cnt-tech"></span></div>
    <div class="pills" id="pills-tech"></div>
  </div>
  <div class="grp" id="grp-motive">
    <div class="gt">收藏动机 <span class="cnt" id="cnt-motive"></span></div>
    <div class="pills" id="pills-motive"></div>
  </div>
  <div class="grp" id="grp-use">
    <div class="gt">用过吗 <span class="cnt" id="cnt-use"></span></div>
    <div class="pills" id="pills-use"></div>
  </div>
  <button class="clear" id="f-clr" hidden>清空全部筛选</button>
  <div class="res-cnt" id="f-cnt"></div>
</div>
<div class="wrap" id="wrap"><div class="empty">加载中…</div></div>

<div class="share-mask" id="shareMask" hidden>
  <div class="share-box">
    <div class="share-title">分享这张卡片</div>
    <textarea id="shareText" readonly></textarea>
    <div class="share-acts">
      <button class="abtn share" id="copyShare">复制文本</button>
      <button class="abtn" id="copyLink">复制深链</button>
      <button class="abtn del" id="closeShare">关闭</button>
    </div>
    <div class="share-note">复制后可直接发给微信 / 钉钉 / 邮件；深链在装有收藏箱的设备上点开即收。</div>
  </div>
</div>

<!-- 悬浮目录：从笔记的 ## / ### 标题抽取，点击平滑跳转到对应位置（长纪要导航） -->
<button class="toc-fab" id="tocFab" type="button" aria-label="目录">目录</button>
<div class="toc-panel" id="tocPanel">
  <div class="toc-h" id="tocHead">目录</div>
  <div class="toc-list" id="tocList"></div>
</div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

// ── 轻量 markdown → HTML（零依赖）：标题 / 粗体 / 斜体 / 行内码 / 列表 / 引用 / 分隔 / 段落 ──
// 先整体 esc 再按行解析，因此只认转义后的形态（如引用行首是 &gt;），天然防注入。
function mdInline(s){
  return s
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function mdToHtml(src){
  var lines = esc(src||'').replace(/\r/g,'').split('\n');
  var out=[], listOpen=null;
  function closeList(){ if(listOpen){ out.push(listOpen==='ul'?'</ul>':'</ol>'); listOpen=null; } }
  for(var i=0;i<lines.length;i++){
    var t = lines[i].trim();
    if(!t){ closeList(); continue; }
    var m;
    if(m = t.match(/^(#{1,6})\s+(.*)$/)){            // # → h2 起（卡片内不抢 h1）
      closeList(); var lv=m[1].length+1;
      out.push('<h'+lv+'>'+mdInline(m[2])+'</h'+lv+'>'); continue;
    }
    if(/^(---+|\*\*\*+)$/.test(t)){ closeList(); out.push('<hr>'); continue; }
    if(m = t.match(/^&gt;\s?(.*)$/)){ closeList(); out.push('<blockquote>'+mdInline(m[1])+'</blockquote>'); continue; }
    if(m = t.match(/^[-*+]\s+(.*)$/)){
      if(listOpen!=='ul'){ closeList(); out.push('<ul>'); listOpen='ul'; }
      out.push('<li>'+mdInline(m[1])+'</li>'); continue;
    }
    if(m = t.match(/^\d+[.)]\s+(.*)$/)){
      if(listOpen!=='ol'){ closeList(); out.push('<ol>'); listOpen='ol'; }
      out.push('<li>'+mdInline(m[1])+'</li>'); continue;
    }
    closeList();
    out.push('<p>'+mdInline(t)+'</p>');
  }
  closeList();
  return out.join('');
}

// 笔记体量统计：用于「约 N 字 · M 分钟」的阅读预期提示（中文按 ~350 字/分钟估）
function mdStats(md, upTo){
  var seg = String(md||'').slice(0, upTo == null ? undefined : upTo);
  var plain = seg.replace(/[#*`>\-\s\[\]()!]/g, '');
  return { chars: plain.length, mins: Math.max(1, Math.round(plain.length / 350)) };
}
// 把结构化笔记按「## 内容纪要」切成「要点层」与「纪要层」：默认只展开要点层，
// 纪要层折叠（内容一字不丢，只是延迟展示）——长文卡片不再把列表撑爆。
function splitNote(md){
  var lines = String(md||'').split('\n'), idx = -1;
  for(var i=0;i<lines.length;i++){
    if(/^##\s*内容纪要/.test(lines[i].trim())){ idx = i; break; }
  }
  if(idx <= 0) return { head: md, body: '', nsec: 0, hchars: 0 };
  var head = lines.slice(0, idx).join('\n').trim();
  var body = lines.slice(idx + 1).join('\n').trim();
  var nsec = body.split('\n').filter(function(l){ return /^###\s+/.test(l.trim()); }).length;
  return { head: head, body: body, nsec: nsec, hchars: mdStats(head).chars };
}

// 折叠区展开状态记忆：轮询会整表重建 DOM，若不记住，用户读一半的「内容纪要」会被冲回收起态。
// toggle 事件不冒泡，所以用捕获阶段监听。
var OPEN = {};
document.addEventListener('toggle', function(e){
  var d = e.target;
  if(d && d.tagName === 'DETAILS' && d.dataset && d.dataset.key){
    OPEN[d.dataset.key] = d.open;
  }
}, true);
function openAttr(key){ return OPEN[key] ? ' open' : ''; }

function cardHTML(it){
  var c = it.card || {};
  var meta = it.meta || {};
  var name = meta.name || it.url;
  var domain = c.domain || '未分类';
  var rec = (c.recommendation!=null) ? ('推荐 '+c.recommendation+'/5') : '';
  var isCog = (it.kind === 'cognition');
  var kindPill = isCog
    ? '<span class="pill k-cog" title="认知端：抖音等内容收藏">认知</span>'
    : '<span class="pill k-prod" title="生产端：GitHub/GitLab 仓库">生产</span>';
  var errPill = (it.status==='error')
    ? '<span class="pill err" title="'+esc(it.error||'解析失败')+'">解析失败</span>'
    : '';
  var stubPill = (c._stub)
    ? '<span class="pill stub" title="'+esc(c.stub_reason||'元数据被反爬拦截，待补充')+'">待补充</span>'
    : '';
  var src = c.source==='llm'
    ? '<span class="src llm" title="由大模型分析生成">AI 分析</span>'
    : '<span class="src heu" title="规则自动生成的预览，未接入深度分析">规则预览</span>';
  var tech = (c.tech_stack||[]).map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('');
  var tags = (c.tags||[]).map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('');
  var rel = (c.related_nodes||[]).map(function(r){
    return '<div class="ri"><span class="rn">'+esc(r.name||r.url)+'</span><span class="rr">'+esc(r.reason)+'</span></div>';
  }).join('');
  var starsTxt = (meta.stars!=null) ? ('<span class="stars">★ '+meta.stars+'</span>') : '';
  // 逐字稿 · 结构化笔记：默认展开「概述 + 核心要点」，「内容纪要」折叠按需展开
  // ——长文卡片不再把列表撑爆；内容一字不丢，只是分层渐进展示。
  var tmdHtml = '';
  if (isCog && c.transcript_md && String(c.transcript_md).trim()) {
    var sn = splitNote(c.transcript_md);
    var st = mdStats(c.transcript_md);
    var nkey = 'note-'+it.id;
    var bodyPart = '';
    if (sn.body) {
      var bs = mdStats(sn.body);
      bodyPart = '<details class="mdmore" data-key="'+nkey+'"'+openAttr(nkey)
               + '><summary>内容纪要 · '+sn.nsec+' 小节 · 约 '+bs.chars
               + ' 字（点击展开）</summary><div class="mdbox mdbody">'+mdToHtml(sn.body)+'</div></details>';
    }
    tmdHtml = '<div class="row"><div class="k">逐字稿 · 结构化笔记'
            + '<span class="note-meta">约 '+st.chars+' 字 · '+st.mins+' 分钟</span></div>'

      '<div class="acts">'+

      '<button class="abtn muted'+(it.feedback==='want'?' fb-on':'')+'" data-act="fb" data-fb="want" data-id="'+it.id+'">还想用</button>'+

// ===== 新筛选：胶囊云（同层 OR，跨层 AND）=====
var LAYERS = ['domain', 'tech', 'motive', 'use'];
var SEL = { domain: [], tech: [], motive: [], use: [], kind: [] }; // 每层选中的取值列表

// 从 URL 预读筛选条件（如 profile/map 页钻取过来：cards.html?domain=AI·LLM）
(function readUrlSel(){
  var qs = new URLSearchParams(location.search);
  LAYERS.forEach(function(layer){
    var v = qs.get(layer);
    if(v) SEL[layer] = v.split(',').filter(Boolean);
  });
  var q = qs.get('q');
  if(q) setTimeout(function(){ var el=document.getElementById('f-q'); if(el) el.value=q; }, 0);
})();

function loadFacets(){
  fetch('/api/facets').then(function(r){return r.json()}).then(function(f){
    LAYERS.forEach(function(layer){ renderPills(layer, f[layer]||[]); });
    // URL 预选：胶囊渲染后高亮对应项
    LAYERS.forEach(function(layer){
      SEL[layer].forEach(function(v){
        var p=document.querySelector('#pills-'+layer+' .pillx[data-v="'+cssEsc(v)+'"]');
        if(p) p.classList.add('on');
      });
    });
    updateClearBtn();
  }).catch(function(){});
}

function cssEsc(s){ return String(s).replace(/["\\]/g,'\\$&'); }

function renderPills(layer, values){
  var box=document.getElementById('pills-'+layer);
  var cntEl=document.getElementById('cnt-'+layer);
  var grp=document.getElementById('grp-'+layer);
  if(!values.length){ grp.style.display='none'; return; }
  grp.style.display='';
  cntEl.textContent='('+values.length+')';
  box.innerHTML=values.map(function(x){
    var on=SEL[layer].indexOf(x.value)>=0;
    return '<span class="pillx'+(on?' on':'')+'" data-v="'+esc(x.value)+'">'+esc(x.value)+
      ' <span class="n">'+x.count+'</span></span>';
  }).join('');
  box.querySelectorAll('.pillx').forEach(function(p){
    p.addEventListener('click',function(){
      var v=p.getAttribute('data-v');
      var i=SEL[layer].indexOf(v);
      if(i>=0){ SEL[layer].splice(i,1); p.classList.remove('on'); }
      else { SEL[layer].push(v); p.classList.add('on'); }
      updateClearBtn(); load();
    });
  });
}

function updateClearBtn(){
  var has=LAYERS.concat(['kind']).some(function(l){return SEL[l].length;})
        || document.getElementById('f-q').value.trim();
  document.getElementById('f-clr').hidden=!has;
}

// 类型筛选（生产端 / 认知端）：胶囊直接写死在 HTML 里，这里只绑定点击
(function wireKindPills(){
  var box=document.getElementById('pills-kind');
  if(!box) return;
  box.querySelectorAll('.pillx').forEach(function(p){
    p.addEventListener('click',function(){
      var v=p.getAttribute('data-v');
      var i=SEL.kind.indexOf(v);
      if(i>=0){ SEL.kind.splice(i,1); p.classList.remove('on'); }
      else { SEL.kind.push(v); p.classList.add('on'); }
      updateClearBtn(); load();
    });
  });
})();

var _lastSig=null;   // 上一次渲染的数据指纹：相同则跳过重建（轮询不打扰阅读）
function load(){
  var w=document.getElementById('wrap');
  var q=document.getElementById('f-q').value.trim();
  var sort=document.getElementById('f-sort').value;
  var params=[];
  LAYERS.concat(['kind']).forEach(function(layer){
    SEL[layer].forEach(function(v){ params.push(layer+'='+encodeURIComponent(v)); });
  });
  if(q) params.push('q='+encodeURIComponent(q));
  if(sort) params.push('sort='+encodeURIComponent(sort));
  var url='/api/cards'+(params.length?('?'+params.join('&')):'');
  fetch(url).then(function(r){return r.json()}).then(function(d){
    var items=d.items||[];
    document.getElementById('f-cnt').textContent='共 '+items.length+' 个仓库'+(items.length?('（已按“'+sortName(sort)+'”排序）'):'');
    if(!items.length){
      var esig='empty:'+url;
      if(_lastSig!==esig){ _lastSig=esig; renderEmpty(); }
      return;
    }
    // 关键：内容与筛选都没变时**不重建 DOM**。
    // 否则每 8s 一次的轮询会把整张卡片表 innerHTML 重写一遍，正在阅读的
    // 折叠区被收回、选中文字被清掉、滚动位置被顶走 —— 用户体感就是「读一半自己折起来了」。
    var sig=url+'\n'+JSON.stringify(items)+'\n'+JSON.stringify(window.__repoUpdates||{});
    if(sig===_lastSig) return;
    _lastSig=sig;
    render(items);
  }).catch(function(){ w.innerHTML='<div class="empty">加载失败，确认服务在运行。</div>'; });
}

function sortName(s){ return s==='stars'?'星标最多':(s==='rec'?'推荐最高':'最近收藏'); }

function renderEmpty(){
  var w=document.getElementById('wrap');
  var anySel=LAYERS.some(function(l){return SEL[l].length;});
  var html='<div class="empty">没有符合当前条件的收藏。';
  if(anySel){
    html+='<div class="res-hint">筛选是「同层任一命中、跨层必须都满足」——试着<b>少选几个条件</b>，'+
      '或点<a id="quick-clr">清空筛选</a>重来。</div>';
  }
  html+='</div>';
  w.innerHTML=html;
  var qc=document.getElementById('quick-clr');
  if(qc) qc.addEventListener('click', clearAll);
}

// 记录正在重算的卡片 id，避免与 8 秒轮询 load() 互相打架（轮询时跳过重建这些卡片）
var REGEN = {};
function cssId(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g,''); }

// 轻量吐司提示（复用主题 .toast）
var _toastT;
function toast(msg){
  var el=document.getElementById('toast');
  if(!el) return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_toastT);
  _toastT=setTimeout(function(){ el.classList.remove('show'); }, 2600);
}

// 卡片「更多」菜单：关闭时同步还原卡片层级
function closeMenu(el){
  var d=el.closest('details.more');
  if(!d) return;
  d.open=false;
  var card=d.closest('.card'); if(card) card.classList.remove('lift');
}

function render(items){
  var w=document.getElementById('wrap');
  var sy=window.scrollY||0;   // 重建前记住视口位置，重建后复位：避免新增卡片把正在读的位置顶走
  // 标注哪些卡片有未读更新（来自全局 window.__repoUpdates）
  items.forEach(function(it){ it.__upd = !!window.__repoUpdates[String(it.id)]; });
  w.innerHTML=items.map(cardHTML).join('');
  applyUpdateBadges();
  buildTOC();                    // 重建后重新抽取目录（标题锚点 id 也要重挂）
  if(sy>0) window.scrollTo(0, sy);
  updateTocFab();
  // 重建后恢复仍在重算中的卡片按钮状态（防止并发重算被整页刷新冲掉）
  Object.keys(REGEN).forEach(function(rid){
    var btn=w.querySelector('#card-'+cssId(rid)+' .abtn[data-act="regen"]');
    if(btn){ btn.disabled=true; btn.textContent='重算中…'; }
  });
  w.querySelectorAll('.abtn').forEach(function(b){
    b.addEventListener('click',function(){
      var act=b.getAttribute('data-act');
      var id=b.getAttribute('data-id');
      if(act==='del'){ closeMenu(b); onDelete(b, id); return; }
      if(act==='share'){ closeMenu(b); onShare(id); return; }
      if(act==='fb'){ closeMenu(b); onFeedback(b, id, b.getAttribute('data-fb')); return; }
      // regen：标记该卡正在重算，期间轮询不整页重建；带超时，失败/超时保留原卡片并提示
      if(REGEN[id]) return; // 已在重算中，防止连点
      REGEN[id]=true;
      b.disabled=true; b.textContent='重算中…';
      var ac=new AbortController();
      var timer=setTimeout(function(){ ac.abort(); }, 12000);
      fetch('/api/card/regenerate',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id:id}), signal:ac.signal})
        .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
        .then(function(d){
          clearTimeout(timer); delete REGEN[id];
          if(d&&d.ok&&d.unchanged){ b.disabled=false; b.textContent='重算';
            toast('大模型暂不可用，已保留原分析卡片'); return; }
          if(d&&d.ok){ toast('已重算并更新'); load(); }
          else { b.disabled=false; b.textContent='重算'; toast('重算未返回结果，原卡片保留'); }
        })
        .catch(function(e){
          clearTimeout(timer); delete REGEN[id];
          b.disabled=false; b.textContent='重算';
          toast(e&&e.name==='AbortError' ? '重算超时（12s），原卡片保留' : '重算失败，原卡片未改动');
        });
    });
  });
  // 「更多」菜单展开时抬升卡片层级，避免被下一张卡遮住
  w.querySelectorAll('details.more').forEach(function(d){
    d.addEventListener('toggle', function(){
      var card=d.closest('.card');
      if(card) card.classList.toggle('lift', d.open);
    });
  });
  // 从其他页面带 ?id= 跳转过来时，定位并高亮对应卡片
  var fid=getParam('id');
  if(fid){ focusCard(fid); }
}

// 仓库更新角标：根据 window.__repoUpdates（repo_id -> [events]）给卡片贴/摘「有更新」
function applyUpdateBadges(){
  document.querySelectorAll('#wrap .card[data-id]').forEach(function(cardEl){
    var id=cardEl.getAttribute('data-id');
    var has=!!window.__repoUpdates[id];
    var existing=cardEl.querySelector('.pill.upd');
    if(has && !existing){
      var top=cardEl.querySelector('.top');
      if(top){ var b=document.createElement('span'); b.className='pill upd'; b.textContent='有更新'; top.appendChild(b); }
    } else if(!has && existing){ existing.remove(); }
  });
}
// nav.js 在加载/检查更新后派发此事件，实时刷新角标
window.addEventListener('repo:updates', function(e){
  window.__repoUpdates = (e.detail && e.detail.byRepo) || {};
  applyUpdateBadges();
});

function getParam(k){
  var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);
  return m?decodeURIComponent(m[1]):'';
}

function focusCard(id){
  var el=document.getElementById('card-'+id);
  if(!el) return;
  // 若当前筛选把该卡片过滤掉了，先清空筛选再定位
  if(el.offsetParent===null){
    clearAll();
    setTimeout(function(){ focusCard(id); }, 350);
    return;
  }
  document.querySelectorAll('.card.focus').forEach(function(c){ c.classList.remove('focus'); });
  el.classList.add('focus');
  el.scrollIntoView({behavior:'smooth', block:'start'});
}

// 使用反馈：用过 / 弃了 / 还想用（再点一次同一个值 = 取消）
function onFeedback(btn, id, fb){
  fetch('/api/item/feedback',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:id, feedback:fb})})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d && d.ok){ toast(d.feedback ? '已记下：' + fbName(fb) : '已取消标记'); load(); }
      else { toast('没记上：' + ((d && d.error) || '')); }
    })
    .catch(function(){ toast('没记上，确认服务在运行'); });
}
function fbName(k){ return k==='used' ? '用过' : (k==='dropped' ? '弃了' : '还想用'); }

function onDelete(btn, id){
  if(!confirm('确定删除这条收藏？关联的图谱、画像数据会同步清除，且不可恢复。')) return;
  btn.disabled=true; btn.textContent='删除中…';
  fetch('/api/item/'+id,{method:'DELETE'}).then(function(r){return r.json()}).then(function(d){
    if(d.ok){ load(); } else { alert('删除失败：'+(d.error||'')); btn.disabled=false; btn.textContent='删除'; }
  }).catch(function(){ alert('删除失败，确认服务在运行'); btn.disabled=false; btn.textContent='删除'; });
}

function onShare(id){
  // 取最新卡片数据拼可分享文本
  fetch('/api/items').then(function(r){return r.json()}).then(function(d){
    var it=(d.items||[]).filter(function(x){return String(x.id)===String(id)})[0];
    if(!it){ alert('未找到该收藏'); return; }
    var c=it.card||{}, meta=it.meta||{};
    var name=meta.name||it.url;
    var isCog=(it.kind==='cognition');
    var lines=[];
    lines.push('【收藏箱 · '+(isCog?'内容卡片':'仓库卡片')+'】');
    lines.push(name+'  '+ it.url);
    if(c.domain) lines.push('领域：'+c.domain);
    if(c.purpose) lines.push('用途：'+c.purpose);
    if(c.tech_stack&&c.tech_stack.length) lines.push('技术栈：'+c.tech_stack.join('、'));
    if(c.why_needed) lines.push('我为什么收：'+c.why_needed);
    if(c.maturity) lines.push('成熟度：'+c.maturity);
    if(isCog && it.raw && String(it.raw).trim()) lines.push('原文逐字稿：'+it.raw);
    if(c.source==='llm') lines.push('（由 AI 分析生成）');
    var txt=lines.join('\n');
    var link=location.origin+'/collect?url='+encodeURIComponent(it.url);
    var mask=document.getElementById('shareMask');
    var ta=document.getElementById('shareText');
    ta.value=txt;
    mask.hidden=false;
    var copyBtn=document.getElementById('copyShare');
    var linkBtn=document.getElementById('copyLink');
    copyBtn.onclick=function(){ ta.value=txt; ta.select(); doCopy(txt,'文本已复制'); };
    linkBtn.onclick=function(){ ta.value=link; ta.select(); doCopy(link,'深链已复制'); };
    document.getElementById('closeShare').onclick=function(){ mask.hidden=true; };
    mask.onclick=function(e){ if(e.target===mask) mask.hidden=true; };
  }).catch(function(){ alert('加载失败'); });
}

function doCopy(text, okMsg){
  var done=function(){ alert(okMsg); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text,okMsg); });
  } else { fallbackCopy(text,okMsg); }
}
function fallbackCopy(text, okMsg){
  var ta=document.getElementById('shareText'); ta.value=text; ta.select();
  try{ document.execCommand('copy'); alert(okMsg); }catch(e){ alert('复制失败，请手动选择文本复制'); }
}

  LAYERS.concat(['kind']).forEach(function(layer){ SEL[layer] = []; });

    document.querySelectorAll('#pills-'+layer+' .pillx').forEach(function(p){ p.classList.remove('on'); });

}

// ══ 悬浮目录：从笔记标题（## / ###）抽取，点击跳转到对应位置 ══
var TOC = {};          // cardId -> [{id, lvl, text, det}]
var _tocRaf = 0;

function buildTOC(){
  TOC = {};
  Array.prototype.forEach.call(document.querySelectorAll('#wrap .card'), function(card){
    var cid = card.getAttribute('data-id');
    var hs = card.querySelectorAll('.mdbox h3, .mdbox h4');   // h2 是笔记标题，不入目录
    var list = [];
    Array.prototype.forEach.call(hs, function(h, i){
      var hid = 'h-' + cid + '-' + i;
      h.id = hid;
      var det = h.closest('details');                          // 标题若在折叠层里，记下 key
      list.push({ id: hid, lvl: h.tagName === 'H4' ? 2 : 1,
                  text: h.textContent.trim(),
                  det: det ? (det.getAttribute('data-key') || '') : '' });
    });
    if(list.length) TOC[cid] = list;
  });
}

function activeTocCard(){
  var best = null, bestD = Infinity;
  Array.prototype.forEach.call(document.querySelectorAll('#wrap .card'), function(card){
    if(!TOC[card.getAttribute('data-id')]) return;
    var r = card.getBoundingClientRect();
    if(r.bottom < 140) return;                                 // 已滚过这张
    var d = Math.abs(r.top - 60);
    if(d < bestD){ bestD = d; best = card; }
  });
  return best;
}

function currentHeadingId(cid){
  var list = TOC[cid] || [], cur = list.length ? list[0].id : '';
  for(var i = 0; i < list.length; i++){
    var el = document.getElementById(list[i].id);
    if(!el) continue;
    if(el.getBoundingClientRect().top <= 96) cur = list[i].id; else break;
  }
  return cur;
}

function renderTocPanel(card){
  var cid = card.getAttribute('data-id');
  var nameEl = card.querySelector('.name');
  var name = nameEl ? nameEl.textContent.trim() : '';
  document.getElementById('tocHead').textContent = name ? ('目录 · ' + name) : '目录';
  var cur = currentHeadingId(cid);
  document.getElementById('tocList').innerHTML = (TOC[cid] || []).map(function(it){
    return '<a class="lv' + it.lvl + (it.id === cur ? ' cur' : '') +
           '" data-h="' + it.id + '" data-det="' + it.det + '">' + esc(it.text) + '</a>';
  }).join('');
}

function tocJump(hid, detKey){
  if(detKey){                                                  // 目标在折叠的纪要层里 → 先展开
    OPEN[detKey] = true;
    var d = document.querySelector('details[data-key="' + detKey + '"]');
    if(d) d.open = true;
  }
  var el = document.getElementById(hid);
  if(el){
    // 等一帧：若刚展开了折叠层，布局更新后再滚动，否则会按展开前的位置跳偏
    requestAnimationFrame(function(){
      el.scrollIntoView({behavior:'smooth', block:'start'});
    });
  }
  document.getElementById('tocPanel').classList.remove('on');
}

function updateTocFab(){
  var card = activeTocCard();
  var fab = document.getElementById('tocFab');
  if(fab) fab.classList.toggle('on', !!card);
  var panel = document.getElementById('tocPanel');
  if(!card){ if(panel) panel.classList.remove('on'); return; }
  if(panel && panel.classList.contains('on')) renderTocPanel(card);
}

document.getElementById('tocFab').addEventListener('click', function(){
  var panel = document.getElementById('tocPanel');
  if(panel.classList.contains('on')){ panel.classList.remove('on'); return; }
  var card = activeTocCard();
  if(!card) return;
  renderTocPanel(card);
  panel.classList.add('on');
});
document.getElementById('tocList').addEventListener('click', function(e){
  var a = e.target && e.target.closest ? e.target.closest('a[data-h]') : null;
  if(a) tocJump(a.getAttribute('data-h'), a.getAttribute('data-det'));
});
document.addEventListener('click', function(e){                 // 点面板外收起
  var panel = document.getElementById('tocPanel');
  if(!panel.classList.contains('on')) return;
  var t = e.target;
  if(t && t.closest && (t.closest('#tocPanel') || t.closest('#tocFab'))) return;
  panel.classList.remove('on');
}, true);
window.addEventListener('scroll', function(){
  if(_tocRaf) return;
  _tocRaf = requestAnimationFrame(function(){ _tocRaf = 0; updateTocFab(); });
}, {passive:true});

loadFacets();
load();
</script>
<div class="toast" id="toast"></div>
<script src="/nav.js"></script>
</body>
