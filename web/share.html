<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="收藏箱分享">
<title>收藏箱 · 分享</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
  header{padding:28px 4px 8px}
  header h1{margin:0}
  header p{margin:6px 0 0}
  .wrap{margin-top:14px}
  [hidden]{display:none !important}
  .field{margin:12px 0 0}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px}
  textarea{resize:vertical; min-height:64px}
  .btn-block{width:100%; margin-top:12px; min-height:50px; font-size:16px}
  .linkbox{font-size:12.5px; color:var(--ink); background:var(--surface-2); border:1px dashed var(--line);
    border-radius:8px; padding:9px 11px; word-break:break-all; margin-top:10px; min-height:38px}
  .linkbox.idle{color:var(--faint)}
  .row{display:flex; gap:8px; margin-top:10px}
  .msg{font-size:13px; margin-top:10px; color:var(--muted)}
  .msg.ok{color:var(--ok)}
  .msg.err{color:var(--err)}
  .tip{font-size:12px; color:var(--muted); line-height:1.6; margin-top:10px}
  code{font-family:var(--mono); font-size:11.5px; background:var(--surface-2); color:var(--accent-2);
    padding:1px 5px; border-radius:4px; border:1px solid var(--line)}
</style>
</head>
<body data-nav="share">
<header>
  <h1>分享</h1>
  <p>从任何地方把链接丢进来——粘贴一段话也行，会自己认出里面的地址。</p>
</header>

<div class="wrap">

  <div class="card">
    <div class="sec-h">粘贴收好</div>
    <div class="field">
      <textarea id="txt" rows="3" placeholder="粘贴仓库链接，或一段含链接的话…"></textarea>
    </div>
    <button class="btn primary btn-block" id="sendText">收好</button>
    <div class="msg" id="txtMsg"></div>
    <div class="tip">手机上也可从微信 / 系统分享菜单选「收藏箱」发过来；装了悬浮球的话，读剪贴板即收。</div>
  </div>

  <div class="card">
    <div class="sec-h">生成分享链接</div>
    <div class="field">
      <input id="repoUrl" type="text" inputmode="url" placeholder="https://github.com/owner/repo" autocomplete="off">
    </div>
    <div class="linkbox idle" id="deepLink">在上方输入链接…</div>
    <div class="row">
      <button class="btn" id="copyLink">复制</button>
      <a class="btn" id="openLink" hidden target="_blank" rel="noopener">打开试试</a>
    </div>
    <div class="tip">把这条链接存成二维码、或从分享菜单发出，点开即收藏。</div>
  </div>

</div>

<script>
var origin = location.origin;

// 用法一：粘贴收好（后端从文字里抽链接）
document.getElementById('sendText').addEventListener('click', function(){
  var t = document.getElementById('txt').value.trim();
  var msg = document.getElementById('txtMsg');
  if(!t){ msg.className='msg err'; msg.textContent='先粘贴点东西。'; return; }
  msg.className = 'msg'; msg.textContent = '收好中…';
  fetch('/collect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,source:'share'})})
    .then(function(r){return r.json()})
    .then(function(d){
      if(!d.ok){ msg.className='msg err'; msg.textContent = d.error || '没能收下。'; return; }
      msg.className = 'msg ok';
      if(d.dup){ msg.textContent = '已经在收藏里了。'; }
      else if(d.kind === 'cognition'){ msg.textContent = '已收好，正在提取逐字稿。'; }
      else { msg.textContent = '已收好，后台正在出卡片。'; }
    })
    .catch(function(){ msg.className='msg err'; msg.textContent='发送失败，确认服务在运行。'; });
});

// 用法二：生成分享深链
var repoUrl = document.getElementById('repoUrl');
var deepLink = document.getElementById('deepLink');
var openLink = document.getElementById('openLink');
function buildDeep(){
  var u = repoUrl.value.trim();
  if(!u){
    deepLink.textContent = '在上方输入链接…';
    deepLink.className = 'linkbox idle';
    openLink.hidden = true;
    return;
  }
  var link = origin + '/collect?url=' + encodeURIComponent(u);
  deepLink.textContent = link;
  deepLink.className = 'linkbox';
  openLink.href = link;
  openLink.hidden = false;
}
repoUrl.addEventListener('input', buildDeep);

document.getElementById('copyLink').addEventListener('click', function(){
  var u = repoUrl.value.trim();
  if(!u){ alert('先在上面填入链接'); return; }
  var link = origin + '/collect?url=' + encodeURIComponent(u);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(function(){ alert('已复制'); })
      .catch(function(){ alert('复制失败，请手动复制下方链接'); });
  } else {
    alert('当前环境不支持自动复制，请手动复制下方链接');
  }
});

buildDeep();
</script>
<script src="/nav.js"></script>
</body>
</html>
